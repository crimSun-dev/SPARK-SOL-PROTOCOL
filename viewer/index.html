:root {
  color-scheme: dark;
  --void: #0c1224;
  --lift: #161d33;
  --bone: #efe6d4;
  --bone-dim: #a39886;
  --filament: #7dbea8;   /* local and live only. Unused until the voice server runs */
  --warn: #e36a4a;
  --core: #f4f0e6;
  --hair: 1px solid var(--bone-dim);
  --floor-h: 72px;
  --plate-w: 380px;
  --gutter: 24px;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --f-read: "Literata", Georgia, serif;
  --f-work: "Schibsted Grotesk", system-ui, sans-serif;
  --f-gauge: "Atkinson Hyperlegible", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--void);
  color: var(--bone);
  font: 400 15px/1.45 var(--f-work);
  overflow: hidden;
  display: grid;
  grid-template-rows: minmax(0, 1fr) var(--floor-h);
  grid-template-areas: "sky" "floor";
  height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── sky ─────────────────────────────────────────────────────────── */
#sky { grid-area: sky; position: relative; min-height: 0; outline: none; }
#graph { position: absolute; inset: 0; }
#sky:focus-visible::after {
  content: ""; position: absolute; inset: 10px; pointer-events: none;
  border: 1px solid var(--bone-dim); opacity: .62;
}
#marks { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#marks svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.region {
  position: absolute; left: 0; top: 0;
  font: italic 400 15px/1 var(--f-read);
  letter-spacing: .03em;
  color: var(--bone-dim);
  opacity: .84;
  white-space: nowrap;
  transition: opacity .4s var(--ease-out);
}
body.focused .region { opacity: .8; }
.region.lit { opacity: 1 !important; }
.name {
  position: absolute; left: 0; top: 0;
  font: 400 13px/1 var(--f-work);
  letter-spacing: .01em;
  color: var(--bone);
  white-space: nowrap;
  padding: 0 2px;
}
.name.focus { font-weight: 500; font-size: 14px; }
.name.hover { color: var(--bone); opacity: .92; }
.leader { stroke: var(--bone-dim); stroke-width: 1; fill: none; vector-effect: non-scaling-stroke; }
.tick { fill: none; stroke: var(--bone); stroke-width: 1; opacity: .7; }

/* ── protocol plate, upper left ───────────────────────────────────── */
.mast {
  position: absolute; top: var(--gutter); left: var(--gutter);
  pointer-events: none; z-index: 2;
}
.mast img { display: block; width: 236px; height: auto; }
.mast .count {
  margin: 10px 0 0 calc(236px * .292);
  font: 400 13px/1 var(--f-gauge);
  letter-spacing: .04em;
  color: var(--bone-dim);
  font-variant-numeric: tabular-nums;
}
.mast .count b { font-weight: 700; color: var(--bone); }

/* ── find, under the protocol plate ───────────────────────────────── */
#find {
  position: absolute; z-index: 3;
  top: calc(var(--gutter) + 92px); left: var(--gutter);
  width: min(340px, calc(100% - 2 * var(--gutter)));
}
.find-field { display: block; background: var(--void); }   /* star names never print through the field */
.find-field input {
  width: 100%; height: 28px; padding: 0 0 4px; margin: 0;
  background: transparent; border: 0; border-bottom: 1px solid rgba(163, 152, 134, .62);
  font: 400 15px/1 var(--f-work); color: var(--bone); border-radius: 0;
}
.find-field input::placeholder { color: var(--bone-dim); opacity: 1; letter-spacing: .02em; }
.find-field input::-webkit-search-cancel-button { filter: grayscale(1) brightness(1.6); cursor: pointer; }
.find-field input:focus-visible { outline: none; border-bottom-color: var(--bone); }
#find-list {
  margin-top: 8px; max-height: min(60vh, 520px); overflow-y: auto;
  background: var(--lift); border: var(--hair);
  scrollbar-width: thin; scrollbar-color: var(--bone-dim) transparent;
}
#find-list .head {
  padding: 10px 14px 6px; font: 400 11.5px/1 var(--f-gauge); letter-spacing: .06em;
  text-transform: uppercase; color: var(--bone-dim);
}
#find-list .head ~ .head { border-top: 1px solid rgba(163, 152, 134, .25); margin-top: 4px; }
.hit {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; margin: 0; padding: 7px 14px 8px;
  color: var(--bone); font: 400 14px/1.3 var(--f-work); overflow-wrap: anywhere;
}
.hit .meta { display: flex; align-items: center; gap: 7px; margin-top: 3px;
  font: 400 12px/1.2 var(--f-gauge); letter-spacing: .02em; color: var(--bone-dim); overflow-wrap: anywhere; }
.hit .meta .dye { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.hit .snip { display: block; margin-top: 4px; font: 400 13px/1.45 var(--f-read); color: var(--bone-dim);
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.hit[aria-selected="true"], .hit:hover { background: rgba(239, 230, 212, .07); }
.hit.nostar { cursor: default; }
#find-list .none { padding: 10px 14px 12px; font: 400 13px/1.4 var(--f-gauge); color: var(--bone-dim); }

/* ── node plate, right ────────────────────────────────────────────── */
#plate {
  position: absolute; z-index: 3;
  top: var(--gutter); right: var(--gutter);
  bottom: auto;
  max-height: calc(100% - var(--floor-h) - 2 * var(--gutter));
  width: var(--plate-w);
  background: var(--lift);
  border: var(--hair);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(0); opacity: 1;
  transition: transform .42s var(--ease-out), opacity .3s var(--ease-out), visibility 0s;
}
#plate[aria-hidden="true"] {
  transform: translateX(24px); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform .28s ease-in, opacity .2s ease-in, visibility 0s .28s;
}
.plate-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 13px 20px;
  border-bottom: 1px solid rgba(163, 152, 134, .35);
  font: 400 13px/1 var(--f-gauge); letter-spacing: .04em; color: var(--bone-dim);
}
.plate-head .dye { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.plate-head .where { color: var(--bone); }
.plate-head .close {
  margin-left: auto; background: none; border: 0; padding: 6px 4px; cursor: pointer;
  font: inherit; letter-spacing: .04em; color: var(--bone-dim); text-transform: uppercase;
}
.plate-head .close:hover { color: var(--bone); }
.plate-body { flex: 0 1 auto; min-height: 0; padding: 22px 20px 24px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--bone-dim) transparent; }
.plate-body h2 {
  margin: 0; font: 500 21px/1.22 var(--f-work); letter-spacing: -.005em; color: var(--bone);
  text-wrap: balance; overflow-wrap: anywhere;
}
.plate-body .key {
  margin: 8px 0 0; font: 400 13px/1.4 var(--f-gauge); letter-spacing: .02em; color: var(--bone-dim);
  overflow-wrap: anywhere;
}
.plate-body .value {
  margin: 26px 0 0; font: 400 26px/1.28 var(--f-read); color: var(--bone); overflow-wrap: anywhere;
}
.plate-body .excerpt {
  margin: 22px 0 0; font: 400 16px/1.62 var(--f-read); color: var(--bone);
  overflow-wrap: anywhere; hyphens: auto; white-space: pre-line;
}
.plate-body .source {
  margin: 22px 0 0; padding-top: 14px; border-top: 1px solid rgba(163, 152, 134, .25);
  font: 400 12.5px/1.45 var(--f-gauge); letter-spacing: .02em; color: var(--bone-dim);
  overflow-wrap: anywhere;
}
.plate-body .source span { display: block; color: var(--bone-dim); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .06em; font-size: 11.5px; }

/* ── floor ────────────────────────────────────────────────────────── */
.floor {
  grid-area: floor; position: relative; z-index: 4;
  border-top: var(--hair);
  background: var(--void);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: 22px 30px;
  column-gap: 24px;
  align-content: center;
  padding: 0 var(--gutter);
}
#status {
  margin: 0; align-self: center;
  font: 400 14px/1 var(--f-gauge); letter-spacing: .04em; color: var(--bone-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#status .src { color: var(--bone-dim); }
#status .src.warn { color: var(--warn); }
#status .gap { display: inline-block; width: 1px; height: 11px; margin: 0 12px; background: var(--bone-dim); opacity: .5; vertical-align: -1px; }
.words { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 22px; }
.word {
  background: none; border: 0; padding: 6px 0; margin: 0; white-space: nowrap;
  font: 400 14px/1 var(--f-gauge); letter-spacing: .04em; color: var(--bone-dim);
}
.word[aria-disabled="true"] { cursor: not-allowed; }
.ask {
  grid-column: 1; align-self: end; position: relative;
}
.ask input {
  width: 100%; height: 28px; padding: 0 0 4px; margin: 0;
  background: transparent; border: 0; border-bottom: 1px solid rgba(163, 152, 134, .45);
  font: 400 16px/1 var(--f-work); color: var(--bone); border-radius: 0;
}
.ask input::placeholder { color: var(--bone-dim); opacity: 1; }
.ask input:disabled { cursor: not-allowed; }
/* An input the operator can use: underline at 62% bone-dim, about 3.2:1 on the void. */
.ask input:enabled { border-bottom-color: rgba(163, 152, 134, .62); }
.word:not([aria-disabled="true"]) { cursor: pointer; }
.word:not([aria-disabled="true"]):hover { color: var(--bone); }
.word.on { color: var(--filament); }
.word.held { color: var(--bone); }
#status [hidden], #badge [hidden] { display: none; }
#status .live { color: var(--filament); }
#status .heard { color: var(--bone); }
#status .warn { color: var(--warn); }
#readout {
  position: absolute; z-index: 2; left: var(--gutter); bottom: 18px;
  max-width: min(720px, calc(100% - var(--plate-w) - 3 * var(--gutter)));
  pointer-events: none;
}
#answer { margin: 0; font: 400 18px/1.42 var(--f-read); color: var(--bone); text-wrap: pretty; }
#answer.warn { color: var(--warn); }
#badge { margin: 10px 0 0; font: 400 12.5px/1 var(--f-gauge); letter-spacing: .04em; color: var(--bone-dim); }
#badge .live { color: var(--filament); }
#badge .warn { color: var(--warn); }
#badge .gap { display: inline-block; width: 1px; height: 10px; margin: 0 10px; background: var(--bone-dim); opacity: .5; vertical-align: -1px; }
:focus-visible { outline: 1px solid var(--bone); outline-offset: 3px; }

@media (max-width: 799px) {
  :root { --gutter: 16px; }
  body.focused { grid-template-rows: minmax(0, 54fr) minmax(0, 46fr) var(--floor-h); grid-template-areas: "sky" "plate" "floor"; }
  #plate { position: relative; grid-area: plate; inset: auto; width: auto; max-height: none; border-width: 1px 0 0 0; }
  .floor { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 22px 30px; }
  #status { grid-column: 1 / -1; }
  .words { grid-row: 2; grid-column: 2; align-self: end; }
  .word { padding-bottom: 4px; }
  #plate[aria-hidden="true"] { display: none; }
  .mast img { width: 176px; }
  .mast .count { margin-left: calc(176px * .292); }
  #find { top: calc(var(--gutter) + 74px); }
  body.focused #find-list { max-height: 30vh; }
  .floor { grid-template-columns: minmax(130px, 1fr) auto; column-gap: 14px; }
  .words { gap: 10px; }
  .word { font-size: 13px; letter-spacing: .02em; }
  #readout { max-width: calc(100% - 2 * var(--gutter)); bottom: 12px; }
  #answer { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  #plate, #plate[aria-hidden="true"], .region { transition: none; }
}
</style>
</head>
<body>
<!--
THESIS: The notes are already a sky. The page is the observatory floor under it: one instrument
reading at the bottom, the stars taking the rest. Refused: a card dashboard, a chat column beside a toy graph, a helmet HUD.
OWN-WORLD: Indigo void #0c1224, bone ink #efe6d4, dim chalk dyes per memory category, verdigris held back for
"local and live". Chart lettering: italic Literata region names under each cluster, hairline leaders to star names,
a flat void-lift plate with a 1px bone-dim edge. No glass, no glow stacks, no tiles.
STORY: Draven sees the F.L.A.X.E.O.N memory as a sky, opens any star to read the real record, and trusts the
floor about where it came from (Neon or the mirror) and that the voice is not running yet.
FIRST VIEWPORT: The sky fills the screen and turns slowly. Lockup and note count small, upper left. The 72px floor:
source and VOICE not running, the inert Ask the notes input, HANDS-FREE OFF. Plate opens right, 380px, on focus.
FORM: Observatory chart under an open night; brief-pinned in SPARK_SOL_IMPECCABLE_DESIGN_SPEC.md. seed: none (brief-pinned).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<main id="sky" tabindex="0" aria-label="Memory sky. Arrow keys move between stars, Enter opens one, Escape closes it.">
  <div id="graph"></div>
  <div id="marks" aria-hidden="true"><svg id="leaders"></svg></div>
  <header class="mast">
    <img src="vendor/brand/spark-sol-lockup.png" width="1910" height="442"
         alt="F.L.A.X.E.O.N SPARK SOL. A bone spiral with one verdigris arc, and an ember X in the family name.">
    <p class="count"><b id="count">0</b> <span id="count-word">notes</span></p>
  </header>
  <div id="find" role="search">
    <label class="find-field">
      <span class="sr-only">Find a star or a file</span>
      <input id="find-q" type="search" placeholder="Find  /" autocomplete="off" spellcheck="false"
             aria-controls="find-list" aria-expanded="false" aria-autocomplete="list">
    </label>
    <div id="find-list" role="listbox" aria-label="Search results" hidden></div>
  </div>
  <p class="sr-only" id="announce" aria-live="polite"></p>
  <div id="readout" aria-live="polite">
    <p id="answer" hidden></p>
    <p id="badge" hidden></p>
  </div>
</main>
  <aside id="plate" aria-hidden="true" aria-labelledby="plate-title">
    <div class="plate-head">
      <span class="dye" id="plate-dye"></span>
      <span class="where" id="plate-region"></span>
      <span id="plate-kind"></span>
      <button class="close" id="plate-close" type="button">Close</button>
    </div>
    <div class="plate-body">
      <h2 id="plate-title"></h2>
      <p class="key" id="plate-key"></p>
      <p class="value" id="plate-value" hidden></p>
      <p class="excerpt" id="plate-excerpt" hidden></p>
      <p class="source" id="plate-source" hidden><span>Source</span><b id="plate-source-text" style="font-weight:400"></b></p>
    </div>
  </aside>

<footer class="floor">
  <p id="status" role="status"><span class="src" id="src">READING</span></p>
  <div class="words">
    <button class="word" id="handsfree" type="button" aria-disabled="true" aria-pressed="false" title="Needs the server's ears">HANDS-FREE OFF</button>
    <button class="word ptt" id="ptt" type="button" aria-disabled="true" title="Needs the server's ears">HOLD TO TALK</button>
  </div>
  <label class="ask">
    <span class="sr-only">Ask the notes</span>
    <input id="ask" type="text" placeholder="Ask the notes" disabled autocomplete="off" title="Answers wait for the server">
  </label>
</footer>

<script src="vendor/3d-force-graph.min.js"></script>
<script src="graph-data.js"></script>
<script>
// The one function that may make sound. A muted tab returns before any audio exists.
// Takes a WAV (URL or Blob) from the local voice, or {text} for the browser's own
// synthesizer (a voice that runs on this machine only). Resolves when the sound ends.
let NOW_PLAYING = null;
function play(what) {
  if (new URLSearchParams(location.search).get("mute") === "1") return Promise.resolve("muted");
  if (what && typeof what === "object" && !(what instanceof Blob)) {
    const u = new SpeechSynthesisUtterance(what.text);
    const v = speechSynthesis.getVoices().filter((x) => x.localService && /^en/i.test(x.lang));
    if (!v.length) return Promise.resolve("no-local-browser-voice");
    u.voice = v[0];
    return new Promise((res) => {
      u.onend = u.onerror = () => { NOW_PLAYING = null; res("ended"); };
      NOW_PLAYING = { stop: () => speechSynthesis.cancel(), pause: () => speechSynthesis.pause(), resume: () => speechSynthesis.resume() };
      speechSynthesis.speak(u);
    });
  }
  const src = typeof what === "string" ? what : URL.createObjectURL(what);
  const audio = new Audio(src);
  return new Promise((res) => {

  const thr = Math.max(.012, mic.floor * 3) * (speaking ? 3 : 1);   // the room's playback must not trip it
  if (!mic.speech) {
    mic.floor = mic.floor * .97 + Math.min(rms, .05) * .03;
    mic.preroll.push(f); if (mic.preroll.length > 5) mic.preroll.shift();
    if (rms > thr) {
      mic.speech = [...mic.preroll, f]; mic.preroll = []; mic.quietMs = 0; mic.voicedMs = FRAME_MS;
      clearTimeout(finishTimer);                       // more speech: append, restart the finish wait
      listeningNow = true;
      if (!speaking) reading("activity", "LISTENING", "live");
    }
    return;
  }
  mic.speech.push(f);
  if (rms > thr) { mic.quietMs = 0; mic.voicedMs += FRAME_MS; } else mic.quietMs += FRAME_MS;
  if (mic.quietMs >= SILENCE_MS) {
    const frames = mic.speech, voiced = mic.voicedMs; mic.speech = null;
    if (voiced < MIN_UTTERANCE_MS) { if (!pending) settle(); return; }   // a click, a cough
    pending = pending ? pending.concat(frames) : frames;
    const endAt = performance.now() - SILENCE_MS;   // when the voice actually stopped
    finishTimer = setTimeout(() => { const p = pending; pending = null; dispatchHandsFree(join(p), endAt); }, FINISH_MS);
  }
}
function settle() { listeningNow = false; if (!speaking && !turnBusy) reading("activity", "STANDING BY", ""); }

async function hearWav(samples, which) {
  const t0 = performance.now();
  const r = await api("/hear?model=" + which, wav(samples), true);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "ears down");
  const d = await r.json();
  return { text: (d.text || "").trim(), secs: d.seconds, ms: performance.now() - t0 };
}
async function dispatchHandsFree(samples, endAt) {
  listeningNow = false;
  try {
    if (speaking) {                                  // over the voice, only stop and wait are heard
      const { text } = await hearWav(samples, "wake");
      const w = text.toLowerCase();
      if (/^\W*(?:(?:hey[\s,]+)?spark)?[\s,]*stop\b/.test(w)) return stopSpeaking();
      if (/^\W*(?:(?:hey[\s,]+)?spark)?[\s,]*wait\b/.test(w)) {
        paused = true; if (NOW_PLAYING) NOW_PLAYING.pause(); return reading("activity", "WAITING", "");
      }
      const said = new Set(answerEl.textContent.toLowerCase().match(/[a-z]+/g) || []);
      const words = w.match(/[a-z]+/g) || [];
      if (words.length >= 3 && words.filter((x) => said.has(x)).length / words.length > .6 && ++echoHits >= 2)
        setAnswer("Headphones are required: the room's playback is reaching the microphone.", true);
      return;
    }
    if (paused) { paused = false; if (NOW_PLAYING) NOW_PLAYING.resume(); reading("activity", "SPEAKING", ""); return; }
    if (holdCommand) { holdCommand = false; clearTimeout(holdTimer); return command(samples, false, endAt); }
    const wake = await hearWav(samples, "wake");
    const m = wake.text.match(ALIAS);
    if (!m) return settle();                          // no alias: discarded, not shown, not posted
    if (!wake.text.slice(m[0].length).replace(/\W/g, "")) {
      holdCommand = true; holdTimer = setTimeout(() => { holdCommand = false; }, 10000);
      settle(); return speak("Still here.");
    }
    return command(samples, true, endAt);
  } catch (e) {
    reading("ears", "EARS DOWN", "warn"); settle();
  }
}
async function command(samples, stripAlias, endAt) {
  reading("activity", "LISTENING", "live");
  let h;
  try { h = await hearWav(samples, "command"); } catch { reading("ears", "EARS DOWN", "warn"); return settle(); }
  let text = h.text;
  if (stripAlias) text = text.replace(ALIAS, "");
  if (!text.replace(/\W/g, "")) return settle();
  reading("activity", text, "heard");
  window.__spark.lastHeard = { text, serverSecs: h.secs, roundTripMs: h.ms,
    endToScreenMs: endAt ? performance.now() - endAt : null };
  await new Promise((r) => setTimeout(r, 450));      // the heard words stay readable a moment
  listeningNow = false;
  turn(text, h.secs);
}

async function setHandsFree(on) {
  if (on && !(await micOn())) on = false;
  handsFree = on;
  hfBtn.textContent = on ? "HANDS-FREE ON" : "HANDS-FREE OFF";
  hfBtn.classList.toggle("on", on); hfBtn.setAttribute("aria-pressed", String(on));
  if (!on && !pttHeld) micOff();
}
hfBtn.addEventListener("click", () => { if (hfBtn.getAttribute("aria-disabled") !== "true") setHandsFree(!handsFree); });

async function pttDown(e) {
  if (pttBtn.getAttribute("aria-disabled") === "true" || pttHeld) return;
  e.preventDefault();
  if (!(await micOn())) return;
  stopSpeaking();
  pttHeld = true; mic.ptt = []; pttBtn.classList.add("held");
  listeningNow = true; reading("activity", "LISTENING", "live");
}
function pttUp() {
  if (!pttHeld) return;
  pttHeld = false; pttBtn.classList.remove("held");
  const frames = mic.ptt; mic.ptt = [];
  const endAt = performance.now();
  if (!handsFree) micOff();
  if (frames.length * FRAME_MS < MIN_UTTERANCE_MS) return settle();
  command(join(frames), false, endAt);                             // push-to-talk skips the wake alias
}
pttBtn.addEventListener("pointerdown", pttDown);
addEventListener("pointerup", pttUp); addEventListener("pointercancel", pttUp);
pttBtn.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) pttDown(e); });
pttBtn.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") pttUp(); });

// ── find: stars from the sky this page holds, files from this machine's index ──
// Stars are matched here, in the page. Files come from the server's read-only
// /search, so on the web viewer they appear only on the machine that runs SPARK SOL.
const findQ = $("find-q"), findList = $("find-list");
let findHits = [], findSel = -1, findTimer = 0, findAbort = null;
const fold = (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "");
function findStars(q) {
  const words = fold(q).split(/[^a-z0-9]+/).filter((w) => w.length > 1);
  if (!words.length) return [];
  const scored = [];
  for (const n of nodes) {
    const label = fold(n.label), key = fold(n.key), region = fold(REGION_NAME[n.group] || n.group);
    const body = fold((n.excerpt || "") + " " + (n.summary || "") + " " + (n.source || ""));
    let s = 0;
    for (const w of words) {
      const t = label.includes(w) ? 6 : key.includes(w) ? 4 : region.includes(w) ? 2 : body.includes(w) ? 1 : 0;
      if (!t) { s = 0; break; }                    // every word must land somewhere
      s += t;
    }
    if (s) scored.push([s + (label.startsWith(words[0]) ? 3 : 0), n]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].label.localeCompare(b[1].label)).slice(0, 8).map((x) => x[1]);
}
function lightFound(list) {                        // the matches go to full dye; the list carries their names
  found.clear(); for (const n of list) found.add(n);
  repaint();
}
function hitButton(label, metaParts, dye, snip, onPick) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "hit"; b.setAttribute("role", "option");
  const t = document.createElement("span"); t.textContent = label; b.append(t);
  const m = document.createElement("span"); m.className = "meta";
  if (dye) { const d = document.createElement("span"); d.className = "dye"; d.style.background = dye; m.append(d); }
  const mt = document.createElement("span"); mt.textContent = metaParts.filter(Boolean).join(" · "); m.append(mt);
  b.append(m);
  if (snip) { const s = document.createElement("span"); s.className = "snip"; s.textContent = snip; b.append(s); }
  if (onPick) b.addEventListener("click", onPick); else b.classList.add("nostar");
  return b;
}
function renderFind(q, stars, files, filesState) {
  findList.textContent = ""; findHits = []; findSel = -1;
  const head = (t) => { const h = document.createElement("div"); h.className = "head"; h.textContent = t; findList.append(h); };
  const none = (t) => { const p = document.createElement("div"); p.className = "none"; p.textContent = t; findList.append(p); };
  head("Stars");
  if (!stars.length) none("No star matches.");
  for (const n of stars) {
    const b = hitButton(n.label, [REGION_NAME[n.group] || n.group, n.group === "documents" || n.group === "sessions" ? "" : n.key],
                        DYES[n.group] || "var(--bone)", "", () => pickStar(n));
    findList.append(b); findHits.push(b);
  }
  head("Files");
  if (filesState === "wait") none("Searching this machine's index…");
  else if (filesState === "down") none(REMOTE ? "Files need SPARK SOL running on this machine." : "The file index did not answer.");
  else if (!files.length) none("No file matches.");
  for (const f of files) {
    const star = nodes.find((n) => n.key === f.project);
    const rel = String(f.title || "").split(" / ").slice(1).join(" / ") || f.path;
    const b = hitButton(rel, [star ? star.label : f.project], star ? DYES[star.group] : "", f.snippet,
                        star ? () => pickStar(star) : null);
    b.title = f.path;
    findList.append(b); if (star) findHits.push(b);
  }
  findList.hidden = false; findQ.setAttribute("aria-expanded", "true");
}
function pickStar(n) { closeFind(false); openStar(n); }
function closeFind(clear) {
  clearTimeout(findTimer); if (findAbort) findAbort.abort();
  findList.hidden = true; findQ.setAttribute("aria-expanded", "false");
  lightFound([]);
  if (clear) findQ.value = "";
}
function runFind() {
  const q = findQ.value.trim();
  clearTimeout(findTimer); if (findAbort) findAbort.abort();
  if (q.length < 2) { closeFind(false); return; }
  const stars = findStars(q);
  lightFound(stars);
  renderFind(q, stars, [], "wait");
  findTimer = setTimeout(async () => {
    findAbort = new AbortController();
    try {
      const r = await fetch(API + "/search?q=" + encodeURIComponent(q), { cache: "no-store", signal: findAbort.signal });
      const d = await r.json();
      if (findQ.value.trim() === q) renderFind(q, stars, d.files || [], "ok");
    } catch (e) {
      if (e.name !== "AbortError" && findQ.value.trim() === q) renderFind(q, stars, [], "down");
    }
  }, 220);
}
function moveSel(d) {
  if (!findHits.length) return;
  if (findSel >= 0) findHits[findSel].setAttribute("aria-selected", "false");
  findSel = (findSel + d + findHits.length) % findHits.length;
  findHits[findSel].setAttribute("aria-selected", "true");
  findHits[findSel].scrollIntoView({ block: "nearest" });
}
findQ.addEventListener("input", runFind);
findQ.addEventListener("keydown", (e) => {
  e.stopPropagation();                             // the sky's own keys stay with the sky
  if (e.key === "ArrowDown") { moveSel(1); e.preventDefault(); }
  else if (e.key === "ArrowUp") { moveSel(-1); e.preventDefault(); }
  else if (e.key === "Enter") { const b = findHits[findSel >= 0 ? findSel : 0]; if (b) b.click(); e.preventDefault(); }
  else if (e.key === "Escape") { closeFind(true); findQ.blur(); $("sky").focus(); }
});
findQ.addEventListener("focus", () => { if (findQ.value.trim().length >= 2) runFind(); });
document.addEventListener("pointerdown", (e) => { if (!$("find").contains(e.target)) { findList.hidden = true; findQ.setAttribute("aria-expanded", "false"); } });
document.addEventListener("keydown", (e) => {
  if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
  e.preventDefault(); findQ.focus(); findQ.select();
});
window.__spark.findStars = findStars;

// ── boot ──────────────────────────────────────────────────────────────
if (REMOTE) {                      // the web viewer: no ask line, no ears, no voice
  for (const el of [ask, hfBtn, pttBtn]) { el.hidden = true; el.disabled = true; el.setAttribute("aria-disabled", "true"); }
  pollHealth();
  setInterval(() => pollHealth(), 5000);
} else {
if ("speechSynthesis" in window) speechSynthesis.getVoices();      // load the list early
pollHealth(true).then((h) => { postHosts(); if (h && h.boot_line) speak("Still here."); });
setInterval(() => pollHealth(), 5000);
setInterval(postHosts, 30000);
}
</script>
</body>
</html>
