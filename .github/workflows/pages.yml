# The read-only web viewer. Publishes viewer/ with an empty GRAPH: no memory is ever
# in this copy. The page reads the live sky from the SPARK SOL server on the viewer's
# own machine (http://127.0.0.1:4700/graph and /health) and shows an empty sky anywhere else.
name: Pages

on:
  push:
    branches: [main]
    paths: ["viewer/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site from viewer/
        run: |
          mkdir _site
          cp -r viewer/. _site/
          rm -f _site/graph-data.js _site/graph-data.js.tmp
          printf '// The web viewer carries no memory. The sky is read live from 127.0.0.1.\nconst GRAPH = null;\n' > _site/graph-data.js
          if grep -rIl '"excerpt"' _site; then echo "memory found in the site" >&2; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
